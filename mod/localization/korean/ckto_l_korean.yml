 ckto_tab_good_tt: "아래 상품 목록에서 선택한 상품을 중심으로 무역로를 구성합니다."
 ckto_pick_hint: "아래 목록에서 상품을 선택하세요."
 ckto_side: "남은 적재량 채우기"
 ckto_side_tt: "남은 칸에 다른 상품을 함께 실으며, 전체 수익이 증가하는 경우에만 유지합니다."
 ckto_crew: "무역상 자동 배정"
 ckto_crew_tt: "능력치를 바탕으로 모든 후보의 임무 적성을 평가해 무역상을 배정합니다. 동점일 경우 현재 무역상이 유지됩니다."
 ckto_task_profit: "최고 수익"
 ckto_task_profit_tt: "각 임무에 가장 적합한 인물만 시험해 가장 수익이 높은 조합을 유지합니다. $negotiate_deals$ 임무는 예상 수익에 표시되지 않는 무역 전문성 성장을 높여줍니다. 기존 무역상은 수익이 낮아지지 않는 경우에만 교체됩니다."
 ckto_task_fixed_tt: "수익을 비교하지 않고 이 임무에 가장 적합한 인물을 배정합니다."
 ckto_optimize: "무역로 자동화"
 ckto_help: "시작 시장을 선택하세요. 특정 상품을 원하면 상품 목록에서 선택합니다. 생성된 초안을 확인한 뒤 기본 무역로 버튼으로 확정하세요."
 ckto_working: "선택지 비교 중…"
 ckto_cancel: "취소"
 ckto_no_match: "도달 가능한 시장 중 이 상품을 수익을 내고 구매하는 곳이 없습니다."
 ckto_result: "월 수익: @gold_icon![TradeRouteDraft.GetTotalExpectedProfit|2] ([Subtract_CFixedPoint(TradeRouteDraft.GetTotalExpectedProfit, TradeRoutePlanner.GetCurrentProfit)|=+2])"